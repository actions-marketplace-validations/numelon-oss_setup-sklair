name: Verify action

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            version: '0.4.0'
          - runner: ubuntu-24.04-arm
            version: 'v0.4.0'
          - runner: macos-15-intel
            version: 'v0.4.0'
          - runner: macos-15
            version: '0.4.0'
          - runner: windows-latest
            version: '0.4.0'
          - runner: windows-11-arm
            version: 'v0.4.0'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          version: ${{ matrix.version }}
      - run: sklair version
      - run: sklair --help
